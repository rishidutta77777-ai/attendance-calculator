<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Calculator</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; color: #1a1a1a; text-align: center; }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #444; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { background-color: #1d4ed8; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      display: none;
    }
    .good { background-color: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
    .warn { background-color: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
    .result h3 { margin: 0 0 8px 0; font-size: 18px; }
    .result p { margin: 6px 0; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Attendance Tracker</h2>
    
    <div class="input-group">
      <label>Days Present</label>
      <input type="number" id="present" placeholder="e.g. 30" min="0">
    </div>

    <div class="input-group">
      <label>Days Absent</label>
      <input type="number" id="absent" placeholder="e.g. 5" min="0">
    </div>

    <div class="input-group">
      <label>Days of Holiday (Official)</label>
      <input type="number" id="holidays" placeholder="e.g. 10" min="0">
    </div>

    <button onclick="calculate()">Calculate</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    function calculate() {
      const present = parseInt(document.getElementById('present').value) || 0;
      const absent = parseInt(document.getElementById('absent').value) || 0;
      const holidays = parseInt(document.getElementById('holidays').value) || 0;
      const output = document.getElementById('output');

      const totalConducted = present + absent;

      if (totalConducted === 0) {
        alert("Please enter valid present and absent numbers.");
        return;
      }

      const percentage = (present / totalConducted) * 100;
      output.style.display = "block";

      if (percentage >= 75) {
        const missable = Math.floor((present / 0.75) - totalConducted);
        
        output.className = "result good";
        output.innerHTML = `
          <h3>✅ Status: Good!</h3>
          <p><strong>Attendance:</strong> ${percentage.toFixed(2)}%</p>
          <p><strong>Total Working Days:</strong> ${totalConducted}</p>
          <hr style="border: none; border-top: 1px solid #a7f3d0; margin: 8px 0;">
          <p>${missable > 0 
            ? `🎉 You can safely miss <b>${missable}</b> upcoming lecture(s) while staying above 75%.` 
            : `⚠️ You are very close to 75%. You cannot miss the next class!`}</p>
        `;
      } else {
        const needed = Math.ceil(3 * totalConducted - 4 * present);
        
        output.className = "result warn";
        output.innerHTML = `
          <h3>⚠️ Warning: Below 75%!</h3>
          <p><strong>Attendance:</strong> ${percentage.toFixed(2)}%</p>
          <p><strong>Total Working Days:</strong> ${totalConducted}</p>
          <hr style="border: none; border-top: 1px solid #fecaca; margin: 8px 0;">
          <p>📌 You must attend the next <b>${needed}</b> consecutive lecture(s) to reach 75%.</p>
        `;
      }
    }
  </script>
</body>
</html>

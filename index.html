<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Calculator</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --subtext: #4b5563;
      --input-border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      --quote-bg: #f8fafc;
      --quote-border: #e2e8f0;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --input-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --quote-bg: #111827;
      --quote-border: #1e293b;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--subtext);
    }

    input {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .calc-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .calc-btn:active {
      background-color: var(--primary-hover);
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      display: none;
      text-align: center;
    }

    .good {
      background-color: rgba(16, 185, 129, 0.12);
      border: 1px solid #10b981;
    }

    .warn {
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
    }

    .circle-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 10px auto;
    }

    svg {
      transform: rotate(-90deg);
      width: 120px;
      height: 120px;
    }

    circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: var(--input-border);
    }

    .circle-progress {
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.3s;
    }

    .circle-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 800;
    }

    .result p {
      margin: 8px 0;
      font-size: 14px;
      color: var(--text);
    }

    .share-container {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .share-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .whatsapp-btn {
      background-color: #25D366;
    }

    .copy-btn {
      background-color: #6366f1;
    }

    .quote-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: var(--quote-bg);
      border: 1px dashed var(--quote-border);
      font-style: italic;
      font-size: 13px;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Attendance Tracker</h2>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    
    <div class="input-group">
      <label>Days Present</label>
      <input type="number" id="present" placeholder="e.g. 30" min="0">
    </div>

    <div class="input-group">
      <label>Days Absent</label>
      <input type="number" id="absent" placeholder="e.g. 5" min="0">
    </div>

    <div class="input-group">
      <label>Days of Holiday (Official)</label>
      <input type="number" id="holidays" placeholder="e.g. 10" min="0">
    </div>

    <button class="calc-btn" onclick="calculate()">Calculate</button>

    <div id="output" class="result">
      <div class="circle-container">
        <svg>
          <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
          <circle class="circle-progress" id="progressCircle" cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="circle-text" id="circleValue">0%</div>
      </div>

      <div id="statusDetails"></div>

      <div class="share-container">
        <button class="share-btn whatsapp-btn" onclick="shareWhatsApp()">Share WhatsApp</button>
        <button class="share-btn copy-btn" onclick="copyCard()">Copy Card</button>
      </div>

      <div class="quote-box" id="quoteText"></div>
    </div>
  </div>

  <script>
    let shareMessage = "";

    const quotes = [
      "“80% of success is showing up.” – Woody Allen",
      "“Discipline is choosing between what you want now and what you want most.”",
      "“Wake up with determination. Go to bed with satisfaction.”",
      "“College degrees are won one morning lecture at a time.”",
      "“Bunk responsibly. Don't let your attendance give you anxiety later!”",
      "“Push yourself, because no one else is going to do it for you.”",
      "“Your future self will thank you for waking up today.”"
    ];

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').innerText = '☀️';
    }

    function calculate() {
      const present = parseInt(document.getElementById('present').value) || 0;
      const absent = parseInt(document.getElementById('absent').value) || 0;
      const total = present + absent;

      if (total === 0) {
        alert("Please enter your classes!");
        return;
      }

      const percent = (present / total) * 100;
      const output = document.getElementById('output');
      const circle = document.getElementById('progressCircle');
      const circleVal = document.getElementById('circleValue');
      const statusDetails = document.getElementById('statusDetails');
      const quoteElement = document.getElementById('quoteText');

      output.style.display = "block";
      circleVal.innerText = `${percent.toFixed(1)}%`;

      const circumference = 314;
      const offset = circumference - (Math.min(percent, 100) / 100) * circumference;
      circle.style.strokeDashoffset = offset;

      let adviceText = "";

      if (percent >= 75) {
        circle.style.stroke = "#10b981";
        output.className = "result good";
        const missable = Math.floor((present / 0.75) - total);

        if (missable > 0) {
          adviceText = `🎉 You can safely miss <b>${missable}</b> more class(es)!`;
          shareMessage = `My attendance is currently at ${percent.toFixed(1)}\%! I can safely miss${missable} lecture(s) and still stay above 75%! 🚀`;
        } else {
          adviceText = `⚠️ On the edge! You cannot miss the next class.`;
          shareMessage = `My attendance is at ${percent.toFixed(1)}%. Right on the boundary—no bunking for me! 😅`;
        }

        statusDetails.innerHTML = `
          <h3 style="color:#10b981; margin: 4px 0;">Safe Zone!</h3>
          <p>Total Working Days: <b>${total}</b></p>
          <p>${adviceText}</p>
        `;
      } else {
        circle.style.stroke = "#ef4444";
        output.className = "result warn";
        const needed = Math.ceil(3 * total - 4 * present);

        adviceText = `📌 You must attend the next <b>${needed}</b> classes continuously to reach 75%.`;
        shareMessage = `My attendance is currently ${percent.toFixed(1)}\%. I need to attend${needed
adviceText = `📌 You must attend the next <b>${needed}</b> classes continuously to reach 75%.`;
        shareMessage = `My attendance is currently ${percent.toFixed(1)}%. I need to attend ${needed} class(es) back-to-back to get back to 75%! 📚`;

        statusDetails.innerHTML = `
          <h3 style="color:#ef4444; margin: 4px 0;">Shortage Warning!</h3>
          <p>Total Working Days: <b>${total}</b></p>
          <p>${adviceText}</p>
        `;
      }

      const randomIndex = Math.floor(Math.random() * quotes.length);
      quoteElement.innerText = quotes[randomIndex];
    }

    function shareWhatsApp() {
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent(shareMessage + "\nCalculate yours here: ");
      window.open(`https://api.whatsapp.com/send?text=${text}${url}`, '_blank');
    }

    function copyCard() {
      navigator.clipboard.writeText(shareMessage).then(() => {
        alert("Copied summary to clipboard!");
      });
    }
  </script>
</body>
</html>

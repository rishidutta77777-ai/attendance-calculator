<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Calculator</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --subtext: #4b5563;
      --input-border: #d1d5db;
      --primary: #2563eb;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      --quote-bg: #f8fafc;
      --quote-border: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --input-border: #334155;
      --primary: #3b82f6;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --quote-bg: #111827;
      --quote-border: #1e293b;
      --badge-bg: #1e3a8a;
      --badge-text: #93c5fd;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .tip-box {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--subtext);
    }

    input {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .calc-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      display: none;
      text-align: center;
    }

    .good {
      background-color: rgba(16, 185, 129, 0.12);
      border: 1px solid #10b981;
    }

    .warn {
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
    }

    .circle-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 10px auto;
    }

    svg {
      transform: rotate(-90deg);
      width: 110px;
      height: 110px;
    }

    circle {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: var(--input-border);
    }

    .circle-progress {
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.8s ease-in-out;
    }

    .circle-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 800;
    }

    .result p {
      margin: 6px 0;
      font-size: 14px;
    }

    .share-container {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }

    .share-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    .whatsapp-btn {
      background-color: #25D366;
    }

    .copy-btn {
      background-color: #6366f1;
    }

    .quote-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: var(--quote-bg);
      border: 1px dashed var(--quote-border);
      font-style: italic;
      font-size: 12px;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Attendance Tracker</h2>
      <button type="button" class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div class="tip-box">
      💡 <b>Tip:</b> If you joined late, simply enter the working days held <i>since your admission</i>. Prior days are automatically excluded.
    </div>

    <div class="input-group">
      <label>Total Working Days Held (Classes)</label>
      <input type="number" id="totalDays" placeholder="e.g. 100" min="1">
    </div>

    <div class="input-group">
      <label>Days / Classes Present</label>
      <input type="number" id="presentDays" placeholder="e.g. 73" min="0">
    </div>

    <button type="button" class="calc-btn" onclick="calculate()">Calculate Attendance</button>

    <div id="output" class="result">
      <div class="circle-container">
        <svg>
          <circle class="circle-bg" cx="55" cy="55" r="45"></circle>
          <circle class="circle-progress" id="progressCircle" cx="55" cy="55" r="45"></circle>
        </svg>
        <div class="circle-text" id="circleValue">0%</div>
      </div>

      <div id="statusDetails"></div>

      <div class="share-container">
        <button type="button" class="share-btn whatsapp-btn" onclick="shareWhatsApp()">Share WhatsApp</button>
        <button type="button" class="share-btn copy-btn" onclick="copyCard()">Copy Text</button>
      </div>

      <div class="quote-box" id="quoteText"></div>
    </div>
  </div>

  <script>
    var shareMessage = "";
    var quotes = [
      "“80% of success is showing up.” – Woody Allen",
      "“Discipline is choosing between what you want now and what you want most.”",
      "“Wake up with determination. Go to bed with satisfaction.”",
      "“College degrees are won one morning lecture at a time.”",
      "“Bunk responsibly. Don't let your attendance give you anxiety later!”",
      "“Push yourself, because no one else is going to do it for you.”",
      "“Your future self will thank you for waking up today.”"
    ];

    function toggleTheme() {
      document.body.classList.toggle('dark');
      var isDark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      var btn = document.getElementById('themeBtn');
      if (btn) btn.innerText = '☀️';
    }

    function calculate() {
      var total = parseInt(document.getElementById('totalDays').value) || 0;
      var present = parseInt(document.getElementById('presentDays').value) || 0;

      if (total <= 0) {
        alert("Please enter a valid number for Total Working Days!");
        return;
      }

      if (present > total) {
        alert("Days present cannot be greater than total working days held!");
        return;
      }

      var absent = total - present;
      var percent = (present / total) * 100;
      var formatted = percent.toFixed(1);

      var output = document.getElementById('output');
      var circle = document.getElementById('progressCircle');
      var circleVal = document.getElementById('circleValue');
      var statusDetails = document.getElementById('statusDetails');
      var quoteElement = document.getElementById('quoteText');

      output.style.display = "block";
      circleVal.innerText = formatted + "%";

      var circumference = 283;
      var capped = percent > 100 ? 100 : percent;
      var offset = circumference - (capped / 100) * circumference;
      circle.style.strokeDashoffset = offset;

      if (percent >= 75) {
        circle.style.stroke = "#10b981";
        output.className = "result good";
        var missable = Math.floor((present / 0.75) - total);

        var note = missable > 0 
          ? "🎉 You can safely miss <b>" + missable + "</b> upcoming class(es)!" 
          : "⚠️ On the edge! You cannot miss the next class.";

        shareMessage = "My attendance is currently at " + formatted + "% (" + present + "/" + total + ")! Can miss " + missable + " lectures safely. 🚀";

        statusDetails.innerHTML = '<h3 style="color:#10b981; margin:4px 0;">Safe Zone!</h3>' +
          '<p>Days Present: <b>' + present + '</b> | Days Absent: <b>' + absent + '</b></p>' +
          '<p>' + note + '</p>';
      } else {
        circle.style.stroke = "#ef4444";
        output.className = "result warn";
        var needed = Math.ceil(3 * total - 4 * present);

        shareMessage = "My attendance is currently at " + formatted + "% (" + present + "/" + total + "). Need to attend " + needed + " class(es) in a row to reach 75%! 📚";

        statusDetails.innerHTML = '<h3 style="color:#ef4444; margin:4px 0;">Shortage Warning!</h3>' +
          '<p>Days Present: <b>' + present + '</b> | Days Absent: <b>' + absent + '</b></p>' +
          '<p>📌 You must attend the next <b>' + needed + '</b> classes continuously to reach 75%.</p>';
      }

      var randomIndex = Math.floor(Math.random() * quotes.length);
      quoteElement.innerText = quotes[randomIndex];
    }

    function shareWhatsApp() {
      var url = encodeURIComponent(window.location.href);
      var text = encodeURIComponent(shareMessage + "\nCalculate yours here: ");
      window.open("https://api.whatsapp.com/send?text=" + text + url, "_blank");
    }

    function copyCard() {
      navigator.clipboard.writeText(shareMessage).then(function() {
        alert("Copied summary to clipboard!");
      });
    }
  </script>
</body>
</html>
